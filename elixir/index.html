<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elixir Playground</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root { --bg: #fbfaf7; --fg: #24212b; --muted: #6b6578; --accent: #6e4a9e; --term: #1d1b22; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16151a; --fg: #e9e6ef; --muted: #9a94a8; --accent: #b79ae0; --term: #0f0e12; }
  }
  :root[data-theme="dark"] { --bg: #16151a; --fg: #e9e6ef; --muted: #9a94a8; --accent: #b79ae0; --term: #0f0e12; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 16px; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); margin-bottom: 8px; min-height: 1.5em; }
  #terminal { background: var(--term); border-radius: 8px; padding: 10px; height: min(70vh, 640px); }
</style>
</head>
<body>
<main>
  <h1>Elixir <span>in your browser</span></h1>
  <p>IEx on Rust-OTP compiled to WebAssembly: OTP and Elixir run entirely in this tab.</p>
  <div id="status">Starting…</div>
  <div id="terminal"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script type="module">
import { Node } from './host.js';
import { cooked } from './terminal.js';

const status = document.getElementById('status');
const term = new Terminal({
  convertEol: true, cursorBlink: true, fontSize: 14,
  fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
  theme: { background: getComputedStyle(document.documentElement).getPropertyValue('--term').trim() },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('terminal'));
fit.fit();
addEventListener('resize', () => fit.fit());

// What a test reads: everything written, as text.
window.playground = { output: '', status: '' };
const decoder = new TextDecoder();
const IEX = ['-noshell', '-elixir_root', '/rotp/lib', '-pa', '/rotp/lib/elixir/ebin',
  '-user', 'elixir', '-extra', '--no-halt', '+iex'];
let node;
function boot() {
  node = new Node({
    onoutput(bytes) {
      const text = decoder.decode(bytes, { stream: true });
      window.playground.output += text;
      term.write(text);
    },
    onstatus(text) {
      window.playground.status = text;
      status.textContent = text === 'running' ? 'Running: Erlang/OTP 29 and Elixir 1.20 on Rust-OTP (WebAssembly)' : text;
    },
    // IEx stopped (Ctrl+C or System.halt): a fresh one.
    onexit() {
      node.worker.terminate();
      term.write('\r\n');
      boot();
    },
  });
  node.start({ args: IEX, env: { PWD: '/work' } });
  window.playground.node = node;
}
if (!crossOriginIsolated) {
  status.textContent = 'This page needs cross-origin isolation (see playground/README.md).';
} else {
  boot();
  cooked(term, { input: (text) => node.input(text), interrupt: () => node.interrupt() });
  term.focus();
}
</script>
</body>
</html>
